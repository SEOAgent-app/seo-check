name: Smoke test
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - id: seo
        uses: SEOAgent-app/seo-check@v1.0.0
        with:
          url: https://paulgraham.com
          max-pages: 5
          telemetry: false
      - run: echo "findings=${{ steps.seo.outputs.findings }}"
